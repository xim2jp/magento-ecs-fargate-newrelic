# nginx listens on 8080 behind Varnish (:80). PHP-FPM is the "php" container in the
# same Fargate task, reachable on localhost:9000.
upstream fastcgi_backend {
    server 127.0.0.1:9000;
}

server {
    listen 8080 default_server;
    server_name _;

    set $MAGE_ROOT /var/www/magento;
    set $MAGE_MODE production;

    # Magento's maintained nginx configuration (locations, fastcgi params, static caching)
    include /var/www/magento/nginx.conf.sample;
}
