; Overrides the official image's zz-docker.conf (sorted after it).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /status

; worker access log to stderr, worker stdout/stderr passed through (container logs)
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{milli}dms %{kilo}Mkb %C%%"
catch_workers_output = yes
decorate_workers_output = no

; keep container env vars (MAGE_MODE, NEW_RELIC_*) visible to PHP
clear_env = no
